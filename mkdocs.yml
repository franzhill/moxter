# Global Defaults: Put common calls (like login or health_check) in the root moxtures.yaml.
# Local Overrides: If a specific test needs a login call with different headers, 
# simply define a moxture with the same name in that test's specific folder. The closest file always takes precedence.
# 
# Parallel execution: (threadsafe)
#   Mockwebs does not support it well: e.g. Mockito.reset() is a "Global Hammer"
#   Mockito mocks are not thread-aware; once you reset a mock, it is blank for every thread in the JVM. 
